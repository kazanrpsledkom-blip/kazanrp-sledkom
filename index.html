<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СК Документы</title>
<script>window.SKReady=new Promise(function(r){window.__skResolve=r;});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Marck+Script&display=swap">
<style>
:root{--bg:#eef0f4;--surface:#ffffff;--ink:#17202b;--muted:#667282;--line:#d9dee6;--brand:#1c3a68;--brand2:#2a5298;--brand-ink:#ffffff;--soft:#e8eef8;--danger:#9b1c2c;--ok:#1d7a4b;--warn:#9a5d00;--ph:#fff0a8;--shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--surface:#171e28;--ink:#e6eaf0;--muted:#97a3b3;--line:#283241;--brand:#6f9fe6;--brand2:#9bbcf0;--brand-ink:#0b1320;--soft:#1e2938;--danger:#ef8a97;--ok:#6fd6a1;--warn:#f0b45a;--ph:#4d4320;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--surface:#171e28;--ink:#e6eaf0;--muted:#97a3b3;--line:#283241;--brand:#6f9fe6;--brand2:#9bbcf0;--brand-ink:#0b1320;--soft:#1e2938;--danger:#ef8a97;--ok:#6fd6a1;--warn:#f0b45a;--ph:#4d4320;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:13px}
.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.review{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.signed{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.void{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:18px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--brand) 16%,transparent),transparent),var(--bg)}
.lcard{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px}
.lcard img{display:block;height:92px;margin:0 auto 14px}
.lcard h1{font-size:20px;text-align:center;margin:0 0 4px}
.lcard p.sub{text-align:center;margin:0 0 22px;color:var(--muted);font-size:13px}
.lcard .btn{width:100%;justify-content:center;padding:10px}

/* shell */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
#top .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
#top .logo img{height:34px}
#top .logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
#q{max-width:380px;width:100%}
#layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 56px)}
#side{padding:14px 10px;border-right:1px solid var(--line);background:var(--surface)}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav h6{margin:10px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
.nav a b{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
#main{padding:20px 24px;min-width:0}
.h{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.h h2{margin:0;font-size:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.row{cursor:pointer}
.tbl tbody tr.row:hover{background:var(--soft)}
.tbl .t{font-weight:600}
.tblwrap{overflow-x:auto}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* template gallery */
.gal h3{margin:18px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tc:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.tc .n{font-size:12px;font-weight:700;color:var(--brand)}
.tc .nm{font-weight:600}

/* modal + toast */
.mback{position:fixed;inset:0;background:rgba(10,16,26,.55);z-index:50;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px;max-height:92vh;overflow:auto}
.modal.wide{max-width:880px}
.modal h3{margin:0 0 14px;font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:360px}
.toast.err{background:var(--danger);color:#fff}
.menu{position:absolute;right:16px;top:52px;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu a:hover{background:var(--soft)}
.me{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:10px}
.me:hover{background:var(--soft)}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:12px}

/* editor */
.edtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.titlein{border:1px solid transparent;background:transparent;font-size:18px;font-weight:600;padding:5px 8px;border-radius:8px;min-width:220px;flex:1;max-width:560px}
.titlein:hover,.titlein:focus{border-color:var(--line);background:var(--surface);outline:none}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:9}
.toolbar .btn{padding:5px 8px;border-color:transparent;background:transparent}
.toolbar .btn:hover{background:var(--soft)}
.toolbar .sepv{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.edmain{display:flex;gap:18px;align-items:flex-start}
.stage{flex:1;min-width:0;display:flex;justify-content:center;overflow:hidden}
.zoomer{width:794px;flex:none;zoom:var(--z,1)}
.panel{width:296px;flex:none;position:sticky;top:calc(116px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 130px);overflow:auto}
.panel h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.panel h4:first-child{margin-top:0}
.panel .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner{background:color-mix(in srgb,var(--warn) 16%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}

/* paper */
.paper{width:794px;min-height:1123px;background:#fff;color:#000;padding:50px 54px 60px 84px;font-family:Tinos,"Times New Roman",Times,serif;font-size:16px;line-height:1.28;box-shadow:var(--shadow);position:relative;border-radius:2px}
.paper.export{box-shadow:none;border-radius:0}
.paper .lh{text-align:center}
.paper .lh img{height:92px;margin-bottom:8px}
.paper .lh .o1{font-size:17px;line-height:1.15;margin:2px 0 14px}
.paper .lh .o2{font-weight:700;font-size:16px;line-height:1.2;margin-bottom:10px}
.paper .lh .o3{font-size:14px;line-height:1.3}
.paper .meta{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px;font-size:15px}
.paper .meta .num{font-style:normal}
.paper .body{outline:none;min-height:300px;margin-top:6px}
.paper .body p{margin:0 0 5px;text-align:justify}
.paper .body p.ind{text-indent:1.25cm}
.paper .body p.addr{margin-left:46%;text-align:left;text-indent:0}
.paper .body p.addr.gap{margin-bottom:14px}
.paper .body ol,.paper .body ul{margin:0 0 5px;padding-left:1.7cm;text-align:justify}
.paper .body li{margin:0 0 3px}
.paper .body h1.doctype{font-size:20px;letter-spacing:.22em;text-align:center;margin:20px 0 2px;font-weight:700}
.paper .body h2.dtitle{font-size:16.5px;text-align:center;margin:2px 0 14px;font-weight:700}
.paper .body h3{font-size:16px;margin:8px 0 4px}
.paper .body table{border-collapse:collapse;width:100%}
.paper .body td,.paper .body th{border:1px solid #444;padding:3px 6px}
.paper .ph{background:var(--ph);color:inherit;border-radius:3px;padding:0 1px}
.paper.export .ph{background:none}
.paper.ro .body{cursor:default}
.paper .sgt{width:100%;border-collapse:collapse;margin-top:34px;table-layout:fixed}
.paper .sgt td{padding:0;vertical-align:bottom;font-size:15px}
.paper .sgt .sl{width:50%;border-bottom:1px solid #000;padding-bottom:3px}
.paper .sgt .sm{width:17%;border-bottom:1px solid #000;position:relative;height:96px;text-align:center}
.paper .sgt .sr{width:33%;border-bottom:1px solid #000;text-align:right;padding-bottom:3px}
.paper .sgt tr.cap td{font-size:11.5px;border:0;padding-top:3px;text-align:center}
.paper .sgt tr.cap td:first-child{text-align:left}
.paper .sgt tr.cap td:last-child{text-align:right}
.paper .sig{font-family:"Marck Script",cursive;font-size:30px;color:#12308a;position:absolute;left:0;right:0;bottom:8px;transform:rotate(-5deg);white-space:nowrap}
.paper .stamp{position:absolute;width:122px;left:50%;margin-left:-70px;bottom:-14px;opacity:.9;mix-blend-mode:multiply;transform:rotate(-6deg)}
.paper .void{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:110px;color:rgba(155,28,44,.16);transform:rotate(-24deg);font-weight:700;letter-spacing:.1em}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--muted);font-size:13px}
.stat.hot b{color:var(--danger)}
.due.over,.duebox.over{color:var(--danger);font-weight:600}.due.soon,.duebox.soon{color:var(--warn);font-weight:600}
.duebox{margin:6px 0;font-size:13px}
.rem{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}.rem.done{opacity:.6}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}
.tc.locked{opacity:.45;cursor:not-allowed}.tc.locked:hover{border-color:var(--line);box-shadow:none}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;margin-left:8px}
.seg a{padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.bdg{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;font-weight:700;min-width:18px;text-align:center;font-style:normal}
#tabbar{display:none}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.olrow{display:flex;gap:10px;align-items:center;padding:4px 0}
.sub2{display:none;font-size:12px}
.chatmode{padding:0!important}
.chatwrap{display:flex;height:calc(100dvh - 56px - env(safe-area-inset-top,0px));min-width:0}
.chcol{flex:1;display:flex;flex-direction:column;min-width:0}
.chhead{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.chhead .topic{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.chq{width:150px}
.msgs{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column}
.msg{display:flex;gap:10px;padding:3px 6px;border-radius:8px;position:relative}
.msg:hover{background:var(--soft)}.msg.grp{padding-top:0}.msg.pinned{border-left:3px solid var(--warn)}.msg.ment{background:color-mix(in srgb,var(--warn) 14%,transparent)}.msg.flash{background:color-mix(in srgb,var(--brand) 22%,transparent)}
.mav{width:36px;height:36px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}.mav.sp0{background:transparent}
.mb{min-width:0;flex:1}.mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.mh .muted{font-size:12px}
.mt{overflow-wrap:anywhere;line-height:1.45}.mt code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}.mt a{color:var(--brand)}.ed{font-size:11px}
.mention{background:color-mix(in srgb,var(--brand) 20%,transparent);color:var(--brand);border-radius:4px;padding:0 3px;font-weight:600}.mention.me{background:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.spoil{background:var(--ink);color:transparent;border-radius:4px;cursor:pointer;padding:0 3px}.spoil.open{background:var(--soft);color:inherit}
.rp{font-style:italic;color:var(--muted)}.rp.do{color:var(--brand2)}
.rtag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px}.rtag.gold{background:#e6c35a;color:#3a2c00}.rtag.blue{background:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--brand)}.rtag.grey{background:var(--soft);color:var(--muted)}
.rq{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 8px;margin-bottom:3px;cursor:pointer;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:4px;cursor:pointer;max-width:380px;background:var(--surface)}.dcard:hover{border-color:var(--brand)}
.rxs{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.rx{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:13px;cursor:pointer;background:var(--surface)}.rx.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.mm{opacity:.0;border:0;background:transparent;cursor:pointer;color:var(--muted);align-self:flex-start;padding:2px 6px;border-radius:6px}.msg:hover .mm,.mm:focus{opacity:1}
.dsep,.nsep{display:flex;align-items:center;gap:10px;margin:12px 0 6px;color:var(--muted);font-size:12px}.dsep:before,.dsep:after,.nsep:before,.nsep:after{content:"";flex:1;height:1px;background:var(--line)}.nsep{color:var(--danger)}.nsep:before,.nsep:after{background:var(--danger);opacity:.5}
.cmp{padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}.cmp.ro{color:var(--muted);text-align:center;font-size:13px}
.cmpbox{display:flex;gap:6px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
.cmpbox textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:140px;padding:6px 4px;line-height:1.4;font-size:14.5px}
.bar{display:flex;gap:8px;align-items:center;padding:6px 14px;background:var(--soft);font-size:13px;border-top:1px solid var(--line)}.bar a{margin-left:auto;cursor:pointer;font-size:18px;padding:0 6px}
.chlist{padding:6px 6px 14px;overflow-y:auto;max-height:calc(100dvh - 56px - 20px)}
.chcat{margin:14px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chan{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}.chan:hover{background:var(--soft);color:var(--ink)}.chan.on{background:var(--soft);color:var(--ink);font-weight:600}.chan.un{color:var(--ink);font-weight:700}.chan .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hash{opacity:.6;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}.pd{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.pd.on{background:var(--ok)}
.chan.add{color:var(--brand)}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.emo a{font-size:26px;text-align:center;padding:8px;border-radius:10px;cursor:pointer}.emo a:hover{background:var(--soft)}
.sheet{display:flex;flex-direction:column;gap:2px}.shl{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:10px;cursor:pointer}.shl:hover{background:var(--soft)}.sheet hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.shl.qo{border:1px solid var(--line);margin-bottom:6px}.shl.qo.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.shl.qo.no{opacity:.5}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg);opacity:.9}}
.mob,.mob-only{display:none}
@media (max-width:1100px){.homegrid{grid-template-columns:1fr}}
@media (max-width:860px){
 #layout{display:block;min-height:0}#side{display:none}

<script type="module">
import { firebaseConfig } from './firebase-config.js';
(async function () {
  if (!firebaseConfig || !firebaseConfig.apiKey || /ВСТАВЬТЕ/.test(firebaseConfig.apiKey)) { window.__skResolve({ error: 'nocfg' }); return; }
  try {
    const V = 'https://www.gstatic.com/firebasejs/12.11.0/';
    const A = await import(V + 'firebase-app.js');
    const Au = await import(V + 'firebase-auth.js');
    const F = await import(V + 'firebase-firestore.js');
    const SYN = 'sk-gsu.example.com';
    const TR = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
    const keyOf = (s) => String(s || '').trim().toLowerCase().replace(/[а-яё]/g, (c) => TR[c] || '').replace(/\s+/g, '_').replace(/[^a-z0-9_.-]/g, '').slice(0, 40);
    const toEmail = (s) => { s = String(s || '').trim(); return s.indexOf('@') > 0 ? s.toLowerCase() : keyOf(s) + '@' + SYN; };
    const app = A.initializeApp(firebaseConfig);
    const auth = Au.getAuth(app);
    const fs = F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    const wrap = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data() });
    const db = {
      doc: (p) => { const r = F.doc(fs, p); return { id: r.id, path: p,
        get: async () => wrap(await F.getDoc(r)), set: (d) => F.setDoc(r, d), update: (d) => F.updateDoc(r, d), delete: () => F.deleteDoc(r),
        onSnapshot: (n, e) => F.onSnapshot(r, (s) => n(wrap(s)), e) }; },
      collection: (p) => { const c = F.collection(fs, p);
        const build = (cs) => ({
          where: (f, o, v) => build(cs.concat([F.where(f, o, v)])),
          orderBy: (f, d) => build(cs.concat([F.orderBy(f, d || 'asc')])),
          limit: (n) => build(cs.concat([F.limit(n)])),
          onSnapshot: (n, e) => F.onSnapshot(cs.length ? F.query(c, ...cs) : c, (qs) => n({ docs: qs.docs.map((d) => ({ id: d.id, data: () => d.data() })) }), e)
        });
        return build([]); }
    };
    window.__skResolve({
      db, synth: toEmail,
      onAuth: (cb) => Au.onAuthStateChanged(auth, (u) => cb(u ? { uid: u.uid, email: u.email } : null)),
      signIn: (login, pw) => Au.signInWithEmailAndPassword(auth, toEmail(login), pw),
      signOut: () => Au.signOut(auth),
      resetPassword: (email) => Au.sendPasswordResetEmail(auth, email),
      changePassword: async (oldPw, newPw) => { const u = auth.currentUser; await Au.reauthenticateWithCredential(u, Au.EmailAuthProvider.credential(u.email, oldPw)); await Au.updatePassword(u, newPw); },
      createAccount: async (email, pw) => {
        const sec = A.initializeApp(firebaseConfig, 'sec' + Date.now());
        try { const a = Au.getAuth(sec); const cred = await Au.createUserWithEmailAndPassword(a, email, pw); const uid = cred.user.uid; await Au.signOut(a); return uid; }
        finally { try { await A.deleteApp(sec); } catch (e) {} }
      },
      createFirst: async (login, pw, rec) => {
        const email = toEmail(login);
        const cred = await Au.createUserWithEmailAndPassword(auth, email, pw);
        const uid = cred.user.uid;
        try {
          await F.runTransaction(fs, async (tx) => {
            const ini = F.doc(fs, 'meta/init');
            const s = await tx.get(ini);
            if (s.exists()) throw new Error('already');
            tx.set(ini, { adminUid: uid, at: Date.now() });
            tx.set(F.doc(fs, 'staff/' + uid), Object.assign({}, rec, { email: email }));
          });
        } catch (e) { try { await Au.deleteUser(cred.user); } catch (x) {} throw e; }
      },
      nextNumber: (key) => F.runTransaction(fs, async (tx) => {
        const r = F.doc(fs, 'counters/' + key);
        const s = await tx.get(r);
        const n = (s.exists() && s.data().n ? s.data().n : 0) + 1;
        tx.set(r, { n: n });
        return n;
      })
    });
  } catch (e) { console.error(e); window.__skResolve({ error: 'nobackend' }); }
})();
</script>

var OK_TAGS={P:1,B:1,STRONG:1,I:1,EM:1,U:1,OL:1,UL:1,LI:1,BR:1,SPAN:1,DIV:1,H1:1,H2:1,H3:1,TABLE:1,TBODY:1,THEAD:1,TR:1,TD:1,TH:1};
var DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,MATH:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,IMG:1,VIDEO:1,AUDIO:1,CANVAS:1,TEMPLATE:1,NOSCRIPT:1};

function sanitize(html,opt){
 var t=document.createElement('template');t.innerHTML=String(html||'');
 (function walk(n){
  Array.prototype.slice.call(n.childNodes).forEach(function(c){
   if(c.nodeType===3)return;
   if(c.nodeType!==1){c.remove();return;}
   var tag=c.tagName;
   if(DROP[tag]){c.remove();return;}
   walk(c);
   if(!OK_TAGS[tag]){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return;}
   Array.prototype.slice.call(c.attributes).forEach(function(a){
    var nm=a.name.toLowerCase();
    if(nm==='class'){var k=a.value.split(/\s+/).filter(function(x){return OK_CLS[x];});if(k.length)c.setAttribute('class',k.join(' '));else c.removeAttribute('class');}
    else if(nm==='style'){var m=/text-align:\s*(left|right|center|justify)/i.exec(a.value);if(m)c.setAttribute('style','text-align:'+m[1].toLowerCase());else c.removeAttribute('style');}
    else if((nm==='colspan'||nm==='rowspan')&&/^\d{1,2}$/.test(a.value)){}
    else c.removeAttribute(a.name);
   });
   if(opt&&opt.unwrapPh&&tag==='SPAN'&&c.classList.contains('ph')&&!/^\[[\s\S]*\]$/.test(c.textContent)){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();}
  });
 })(t.content);
 var d=document.createElement('div');d.appendChild(t.content);return d.innerHTML;
}

function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function newSalt(){return b64(crypto.getRandomValues(new Uint8Array(16)));}
async function hashPw(pw,salt){
 var enc=new TextEncoder();
 var key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),function(c){return c.charCodeAt(0);}),iterations:150000,hash:'SHA-256'},key,256);
 return b64(new Uint8Array(bits));
}

function authMsg(e){var c=(e&&e.code)||'';
 if(/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(c))return 'Неверный логин или пароль';
 if(/too-many/.test(c))return 'Слишком много попыток, подождите несколько минут';
 if(/network/.test(c))return 'Нет соединения с сервером';
 if(/email-already/.test(c))return 'Такой логин уже занят';
 if(/weak-password/.test(c))return 'Пароль слишком простой, нужно не меньше 6 символов';
 if(/permission-denied/.test(c))return 'недостаточно прав';
 if(e&&e.message==='already')return 'система уже настроена, войдите под своим логином';
 return (e&&e.message)||c||'ошибка';}

function myRank(){return S.me?(RANK[S.me.role]||1):0;}
function dmId(k){return 'dm_'+[S.me.key,k].sort().join('_');}
function nameOf(k){return S.staff[k]?S.staff[k].name:'';}
function canReadCh(c){if(!c||!S.me)return false;if(c.type==='dm')return (c.members||[]).indexOf(S.me.key)>=0;return myRank()>=(c.minRank||1);}
function canWriteCh(c){return canReadCh(c)&&myRank()>=(c.writeRank||1);}
function unread(c){return !!c&&canReadCh(c)&&c.lastBy!==S.me.key&&(c.lastTs||0)>(S.reads[c.id]||0);}

function parseSend(raw){
 var t=raw.trim(),kind='text',text=t,nm=short(S.me.name)||S.me.login||'';
 var m=/^\/(\w+)\s*(.*)$/.exec(t);
 if(m){var c=m[1].toLowerCase(),a=m[2].trim();
  if(c==='roll'){var n=Math.max(2,Math.min(1000,parseInt(a,10)||20));kind='roll';text='🎲 '+nm+' бросает d'+n+': '+(1+Math.floor(Math.random()*n));}
  else if(c==='coin'){kind='roll';text='🪙 '+nm+' подбрасывает монету: '+(Math.random()<.5?'орёл':'решка');}
  else if(c==='me'&&a){kind='me';text=nm+' '+a;}
  else if(c==='do'&&a){kind='do';text=a+' ('+nm+')';}
  else if(c==='try'&&a){kind='roll';text='🎯 '+nm+' '+a+': '+(Math.random()<.5?'удачно':'неудачно');}
  else if(c==='shrug'){text=(a?a+' ':'')+'¯\\_(ツ)_/¯';}
  else if(c==='gavel'){kind='roll';text='⚖️ '+nm+' стучит молотком: «Порядок в зале!»';}
 }
 return {kind:kind,text:text};
}
function mentionsOf(text){
 var out=[];var re=/(^|\s)@([\wа-яёА-ЯЁ.\-]+)/g,m;
 while((m=re.exec(text))){var n=m[2].toLowerCase();if((n==='all'||n==='все')&&isLead()){out.push('all');continue;}
  Object.keys(S.staff).forEach(function(k){var st=S.staff[k];if(String(st.login||'').toLowerCase()===n||String((st.name||'').split(' ')[0]).toLowerCase()===n){if(out.indexOf(k)<0)out.push(k);}});}
 return out;
}

function lawsHead(){return '<div class="h"><h2>Законодательство</h2><div class="sp"></div><input id="lq" class="inp" style="max-width:440px" placeholder="Поиск по законам и правилам: слово, номер статьи" value="'+esc(S.lq)+'" aria-label="Поиск по законодательству"></div><div id="lres"></div>';}

function lawBody(){
 var box=$('#lres');if(!box||!LAWS)return;
 var terms=S.lq.toLowerCase().split(/\s+/).filter(Boolean);
 if(S.lq.trim().length>=2){
  var res=[];
  LAWS.forEach(function(d){d.sections.forEach(function(s,i){
   var hay=(s.h+' '+s.t).toLowerCase();var ok=terms.every(function(t){return hay.indexOf(t)>=0;});if(!ok)return;
   var sc=0,hl=s.h.toLowerCase();terms.forEach(function(t){if(hl.indexOf(t)>=0)sc+=6;var p=0,c=0;while((p=hay.indexOf(t,p))>=0&&c<20){c++;p+=t.length;}sc+=c;});
   res.push({d:d,i:i,s:s,sc:sc});
  });});
  res.sort(function(a,b){return b.sc-a.sc;});
  var h='<p class="muted" style="margin:0 0 10px">Найдено: '+res.length+(res.length>60?' (показаны первые 60)':'')+'</p>';
  if(!res.length)h+='<div class="card empty">Ничего не найдено.</div>';
  res.slice(0,60).forEach(function(r){
   var low=r.s.t.toLowerCase(),pos=-1;for(var k=0;k<terms.length&&pos<0;k++)pos=low.indexOf(terms[k]);
   var a=Math.max(0,pos-90),sn=r.s.t.slice(a,a+260).replace(/\n/g,' ');var e=esc(sn);
   terms.forEach(function(t){if(t.length>1)e=e.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');});
   h+='<div class="card lawhit" data-act="lawopen" data-id="'+esc(r.d.id)+'" data-i="'+r.i+'"><div class="muted" style="font-size:12px">'+esc(r.d.title)+'</div><div style="font-weight:600;margin:2px 0 4px">'+esc(r.s.h)+'</div><div style="font-size:13.5px;color:var(--muted)">'+(a>0?'…':'')+e+(a+260<r.s.t.length?'…':'')+'</div></div>';
  });
  box.innerHTML=h;return;
 }
 if(S.lawId){
  var d=LAWS.filter(function(x){return x.id===S.lawId;})[0];if(!d){S.lawId=null;return lawBody();}
  var s=d.sections[S.lawSec]||d.sections[0];
  var toc=d.sections.map(function(x,i){return '<a class="'+(i===S.lawSec?'on':'')+'" data-act="lawsec" data-i="'+i+'">'+esc(x.h)+'</a>';}).join('');
  var paras=s.t.split('\n').map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
  box.innerHTML='<div class="edtop"><button class="btn ghost" data-act="lawback">'+ic('back')+'Все документы</button><h3 style="margin:0">'+esc(d.title)+'</h3></div><div class="lawwrap"><nav class="toc card">'+toc+'</nav><article class="card lawtext"><div class="muted" style="font-size:12px">'+esc(s.g||'')+'</div><h3>'+esc(s.h)+'</h3>'+paras+'<div class="row2" style="display:flex;gap:8px;margin-top:16px"><button class="btn sm" data-act="lawprev" '+(S.lawSec<=0?'disabled':'')+'>← Предыдущая</button><button class="btn sm" data-act="lawnext" '+(S.lawSec>=d.sections.length-1?'disabled':'')+'>Следующая →</button></div></article></div>';
  var on=$('.toc a.on',box);if(on)on.scrollIntoView({block:'nearest'});
  return;
 }
 var kinds=[['law','Законы и кодексы'],['rule','Правила проекта']];var h2='';
 kinds.forEach(function(k){h2+='<h3 class="lawh">'+k[1]+'</h3><div class="grid">'+LAWS.filter(function(d){return d.kind===k[0];}).map(function(d){return '<div class="tc" data-act="lawdoc" data-id="'+esc(d.id)+'"><span class="nm">'+esc(d.title)+'</span><span class="muted">'+d.sections.length+' '+(k[0]==='law'?'статей и разделов':'разделов')+'</span></div>';}).join('')+'</div>';});
 box.innerHTML=h2;
}
/* events */
var ACT={
 login:doLogin,setup:doSetup,
 menu:function(){S.menu=!S.menu;renderTop();},
 logout:function(){flush();S.menu=false;S.cur=null;S.SKB.signOut();},
 dup:dupDoc,
 theme:function(){var c=null;try{c=localStorage.getItem('sk.theme');}catch(e){}var n=c==='light'?'dark':(c==='dark'?'':'light');try{if(n)localStorage.setItem('sk.theme',n);else localStorage.removeItem('sk.theme');}catch(e){}applyTheme();renderTop();},
 remadd:function(){var t=$('#remtext');if(!t||!t.value.trim())return;addRemark(t.value.trim());flush().then(function(){renderPanel(true);});},
 remdone:function(el){var d=cur();if(!d)return;var r=(d.remarks||[]).map(function(x){return Object.assign({},x);});var i=+el.dataset.i;if(r[i]){r[i].done=true;queueSave({remarks:r});flush().then(function(){renderPanel(true);});}},
 lawins:function(){var sel=window.getSelection();S.savedRange=(sel&&sel.rangeCount&&$('#bodyEd')&&$('#bodyEd').contains(sel.anchorNode))?sel.getRangeAt(0).cloneRange():null;lawInsModal();},
 liref:function(el){liInsert(el,false);},litext:function(el){liInsert(el,true);},
 opencase:function(el){S.view='docs';S.filter=isLead()?'all':'mine';S.q=(el.dataset.c||'').toLowerCase();var q=$('#q');if(q)q.value=el.dataset.c||'';renderSide();renderMain();},
 area:function(el){setArea(el.dataset.v);},
 more:moreSheet,
 chopen:function(el){closeModal();openChannel(el.dataset.id);},
 chback:function(){if(S.chat.unsub){S.chat.unsub();S.chat.unsub=null;}S.chat.cid=null;renderSide();renderMain();},
 dmopen:function(el){S.area='chat';S.view='chat';closeModal();dmOpen(el.dataset.k);},
 chnew:function(){chanModal('');},chedit:function(){chanModal(S.chat.cid);},chsave:function(el){chanSave(el.dataset.id||'');},
 chdel:async function(el){if(!confirm('Удалить канал и скрыть его для всех? Сообщения останутся в базе, но канал пропадёт из списка.'))return;try{await S.db.doc('channels/'+el.dataset.id).delete();closeModal();if(S.chat.cid===el.dataset.id){S.chat.cid=null;}renderSide();renderMain();}catch(e){toast('Ошибка: '+errMsg(e),'err');}},
 send:sendMsg,attach:attachModal,pins:pinsModal,
 attpick:function(el){var d=S.docs[el.dataset.id];if(d){S.chat.attach={id:d.id,title:d.title,number:d.number||'',status:d.status};}closeModal();paintBar();},
 barx:function(){S.chat.reply=null;S.chat.edit=null;S.chat.attach=null;var ta=$('#cmp');if(ta&&S.chat.edit===null)paintBar();paintBar();},
 emojiC:function(){emojiModal('c','');},
 emopick:function(el){var e=el.dataset.e;closeModal();if(el.dataset.mode==='rx'){toggleRx(el.dataset.m,e);}else{var ta=$('#cmp');if(ta){ta.value+=e;ta.focus();}}},
 rx:function(el){toggleRx(el.dataset.m,el.dataset.e);},
 mmenu:function(el){msgMenu(el.dataset.m);},
 mreply:function(el){var m=findMsg(el.dataset.m);closeModal();if(m){S.chat.reply={id:m.id,name:m.name,text:(m.text||'').slice(0,80)};S.chat.edit=null;paintBar();var ta=$('#cmp');if(ta)ta.focus();}},
 mreact:function(el){var id=el.dataset.m;closeModal();emojiModal('rx',id);},
 mcopy:function(el){var m=findMsg(el.dataset.m);closeModal();if(m&&navigator.clipboard){navigator.clipboard.writeText(m.text||'').then(function(){toast('Скопировано');});}},
 medit:function(el){var m=findMsg(el.dataset.m);closeModal();if(m){S.chat.edit=m.id;S.chat.reply=null;S.chat.attach=null;paintBar();var ta=$('#cmp');if(ta){ta.value=m.text||'';ta.focus();}}},
 mpin:async function(el){var m=findMsg(el.dataset.m);closeModal();if(!m)return;try{await S.db.doc('channels/'+S.chat.cid+'/messages/'+m.id).update({pinned:!m.pinned});}catch(e){toast('Ошибка: '+errMsg(e),'err');}},
 mdel:async function(el){var id=el.dataset.m;closeModal();if(!confirm('Удалить сообщение?'))return;try{await S.db.doc('channels/'+S.chat.cid+'/messages/'+id).delete();}catch(e){toast('Ошибка: '+errMsg(e),'err');}},
 goto:function(el){var n=$('#m_'+el.dataset.m);if(n){n.scrollIntoView({block:'center',behavior:'smooth'});n.classList.add('flash');setTimeout(function(){n.classList.remove('flash');},1500);}},
 spoil:function(el){el.classList.toggle('open');},
 chatdoc:function(el){var d=S.docs[el.dataset.id];if(!d||!canSee(d)){toast('Документ недоступен вам или удалён','err');return;}S.area='docs';S.view='editor';S.cur=d.id;renderTop();renderSide();mountEditor(d.id);},
 duty:dutyModal,dusave:dutySave,
 qpick:function(el){if(Q.done)return;var o=Q.cur.opts[+el.dataset.i];Q.done=true;if(o===Q.cur.ans){Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;try{localStorage.setItem('sk.quizBest',Q.best);}catch(e){}}toast('Верно!');}else{Q.streak=0;toast('Не угадали. Верный ответ подсвечен.');}paintQuiz();},
 qnext:function(){quizNext();paintQuiz();},
 firston:function(){S.first=true;renderLogin();},firstoff:function(){S.first=false;renderLogin();},
 forgot:async function(){var em=prompt('Введите e-mail, который указан в вашей учётной записи:');if(!em)return;try{await S.SKB.resetPassword(em.trim());alert('Если такой адрес есть в системе, на него отправлено письмо со ссылкой для смены пароля.');}catch(e){alert('Не удалось отправить письмо: '+authMsg(e));}},
 staffreset:async function(el){var s=S.staff[el.dataset.k];if(!s||!s.email)return;try{await S.SKB.resetPassword(s.email);toast('Письмо отправлено на '+s.email);}catch(e){toast('Ошибка: '+authMsg(e),'err');}},
 lawdoc:function(el){S.lawId=el.dataset.id;S.lawSec=0;S.lq='';renderLaws();},
 lawback:function(){S.lawId=null;renderLaws();},
 lawopen:function(el){S.lawId=el.dataset.id;S.lawSec=+el.dataset.i;S.lq='';renderLaws();window.scrollTo(0,0);},
 lawsec:function(el){S.lawSec=+el.dataset.i;lawBody();window.scrollTo(0,0);},
 lawprev:function(){if(S.lawSec>0){S.lawSec--;lawBody();window.scrollTo(0,0);}},
 lawnext:function(){S.lawSec++;lawBody();window.scrollTo(0,0);},
 profile:function(){S.menu=false;renderTop();profileModal();},
 settings:function(){S.menu=false;renderTop();settingsModal();},
 nav:function(el){flush();S.area='docs';S.view=el.dataset.view;if(el.dataset.filter)S.filter=el.dataset.filter;S.cur=null;S.menu=false;renderTop();renderSide();renderMain();},
 newdoc:function(){flush();S.area='docs';S.view='tpl';S.cur=null;renderSide();renderMain();},
 mk:function(el){createDoc(el.dataset.id);},
 open:function(el){S.area='docs';S.view='editor';S.cur=el.dataset.id;renderSide();mountEditor(el.dataset.id);},
 back:async function(){await flush();S.view='docs';S.cur=null;renderSide();renderMain();},
 jf:function(el){S.jf=el.dataset.v;renderMain();},
 csv:csv,pdf:pdf,regnum:regNum,sign:signDoc,
 st:function(el){var v=el.dataset.v,d=cur();if(v==='draft'&&d&&d.status==='review'&&isLead()&&d.owner!==S.me.key){var t=prompt('Что нужно исправить? Замечание увидит автор документа.','');if(t===null)return;if(t.trim())addRemark(t.trim());}setStatus(v);},
 phnext:function(){phNext(false);},
 deldoc:async function(){var d=cur();if(!d||!confirm('Удалить документ «'+d.title+'»? Это действие нельзя отменить.'))return;try{await docRef(d.id).delete();S.view='docs';S.cur=null;pending=null;renderSide();renderMain();}catch(e){toast('Ошибка: '+errMsg(e),'err');}},
 staffedit:function(el){staffModal(el.dataset.k||'');},
 staffsave:function(el){staffSave(el.dataset.k||'');},
 setsave:settingsSave,pwsave:pwSave,mclose:closeModal
};
document.addEventListener('click',function(e){
 var cmd=e.target.closest('[data-cmd]');
 if(cmd){var ed=$('#bodyEd');if(ed){ed.focus();document.execCommand(cmd.dataset.cmd,false,null);onBody();}return;}
 var el=e.target.closest('[data-act]');
 if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el,e);return;}
 if(S.menu&&!e.target.closest('.menu')){S.menu=false;if(S.me)renderTop();}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'){var a=document.activeElement;if(a&&(a.id==='l_pass'||a.id==='l_login')){e.preventDefault();doLogin();}if(a&&(a.id==='s_p2')){e.preventDefault();doSetup();}}
 if(e.key==='Escape')closeModal();
});
document.addEventListener('input',function(e){
 var f=e.target.dataset&&e.target.dataset.f;if(!f)return;var d=cur();if(!d)return;
 if(f.indexOf('sign.')===0){var k=f.slice(5);var sg=Object.assign({},d.sign||{});sg[k]=e.target.value;queueSave({sign:sg});paintSign();}
 else if(f==='date'){queueSave({date:e.target.value});paintHead();}
 else if(f==='caseNo'){queueSave({caseNo:e.target.value.trim()});}
 else if(f==='dueLabel'){queueSave({dueLabel:e.target.value});}
 else if(f==='due'){queueSave({due:e.target.value?new Date(e.target.value).getTime():null});}
});
document.addEventListener('change',function(e){
 var f=e.target.dataset&&e.target.dataset.f;if(!f)return;
 if(f==='access'){queueSave({access:e.target.value});flush();}
 else if(f==='dueDone'){queueSave({dueDone:e.target.checked});flush().then(function(){renderPanel(true);});}
 else if(f==='due'){flush().then(function(){renderPanel(true);});}
});
window.addEventListener('beforeunload',function(){if(pending)flush();});
boot();
})();
</script>
